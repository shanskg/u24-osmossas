name: U24 × OSMOSSAS Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline"
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install Pillow
          python3 -m pip install -U yt-dlp

      - name: Generate branding assets
        working-directory: scripts
        run: python3 logo_generator.py

      - name: Download United24 Shorts
        working-directory: scripts
        env:
          LIMIT: 12
        run: python3 download_gha.py

      - name: Apply OSMOSSAS branding
        working-directory: scripts
        run: python3 overlay.py

      - name: Rotate videos
        working-directory: scripts
        run: python3 rotate.py

      - name: Generate gallery
        working-directory: scripts
        run: python3 gallery.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "auto: U24 shorts $(date +%Y%m%d-%H%M)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
